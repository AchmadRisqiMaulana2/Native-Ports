name: Build Android 9+ Native Port APK

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Java + Kotlin Native Port Verification Suite
        run: |
          if ! bash scripts/run-tests.sh > /tmp/test.log 2>&1; then
            cat /tmp/test.log
            echo "::error title=TestFailure::$(tail -n 8 /tmp/test.log | tr '\n' ' ')"
            exit 1
          fi
          cat /tmp/test.log

      - name: Build & Sign Android 9+ (minSdk 28) Oprek APK
        run: |
          if ! bash scripts/build-apk.sh > /tmp/build.log 2>&1; then
            cat /tmp/build.log
            echo "::error title=BuildFailure::$(tail -n 8 /tmp/build.log | tr '\n' ' ')"
            exit 1
          fi
          cat /tmp/build.log

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeedingFrenzy-Android9Plus-Oprek-APK
          path: FeedingFrenzy-Android9Plus-Oprek-debug.apk
